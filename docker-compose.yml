name: financas

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: financas
      POSTGRES_USER: financas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financas -d financas"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://financas:${POSTGRES_PASSWORD}@db:5432/financas
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET no .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTER: ${ALLOW_REGISTER:-true}
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3003}:80"
    depends_on:
      api:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGDATABASE: financas
      PGUSER: financas
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      TZ: America/Sao_Paulo
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
